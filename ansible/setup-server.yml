---
- name: Configure Web Server & Deploy App
  hosts: web_servers
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Pull the welcome app Docker image
      docker_image:
        name: makihaji/welcome-app:v1
        source: pull
        force_source: yes

    - name: Stop any existing container on port 80
      docker_container:
        name: web-app
        state: absent
        ports:
          - "80:80"
        force_kill: yes
      ignore_errors: yes

    - name: Start the web app on port 80
      docker_container:
        name: web-app
        image: makihaji/welcome-app:v1
        state: started
        ports:
          - "80:80"
        restart: yes
        restart_policy: always
